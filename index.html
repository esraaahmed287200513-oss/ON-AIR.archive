<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>ON AIR بالعَافِية</title>

    <meta
        name="description"
        content="ON AIR بالعَافِية — Student Film Production Team"
    >

    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         CAMERA SOUND
    ========================== -->

    <audio
        id="cameraSound"
        src="camera-shutter.wav"
        preload="auto">
    </audio>


    <!-- =========================
         LOADING SCREEN
    ========================== -->

    <div id="loader">

        <div class="loader-logo">
            ON AIR
        </div>

        <div class="loader-line"></div>

        <div class="loader-status">
            INITIALIZING...
        </div>

    </div>


    <!-- =========================
         WEBSITE
    ========================== -->

    <main id="website">

        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="top-bar">

            <div class="rec">

                <span class="rec-dot"></span>

                <span>REC</span>

            </div>


            <div class="technical-info">

                <span>FRAME 001</span>

                <span class="separator">|</span>

                <span>ISO 800</span>

                <span class="separator">|</span>

                <span>24 FPS</span>

            </div>


            <nav class="language">

                <button
                    type="button"
                    class="active"
                    data-lang="ar"
                    aria-pressed="true">
                    AR
                </button>

                <span>/</span>

                <button
                    type="button"
                    data-lang="en"
                    aria-pressed="false">
                    EN
                </button>

            </nav>

        </header>


        <!-- =========================
             HERO
        ========================== -->

        <section
            class="hero"
            id="hero"
            tabindex="0"
        >

            <div class="hero-background"></div>


            <!-- CAMERA CORNERS -->

            <div class="camera-corner top-left"></div>

            <div class="camera-corner top-right"></div>

            <div class="camera-corner bottom-left"></div>

            <div class="camera-corner bottom-right"></div>


            <!-- CENTER MARKS -->

            <div class="cross cross-left"></div>

            <div class="cross cross-right"></div>


            <!-- =========================
                 HERO CONTENT
            ========================== -->

           <div class="hero-content intro-animation">

    <!-- SIGNAL -->
    <div class="intro-signal">
        <span class="signal-dot"></span>
        <span>SIGNAL DETECTED</span>
    </div>

    <!-- LOGO -->
    <div class="animated-logo">

        <!-- tracking points -->
        <span class="track-point point-1"></span>
        <span class="track-point point-2"></span>
        <span class="track-point point-3"></span>
        <span class="track-point point-4"></span>

        <!-- tracking lines -->
        <span class="track-line line-top"></span>
        <span class="track-line line-bottom"></span>

        <!-- ON AIR -->
        <div class="logo-english" dir="ltr">
            <span class="logo-letter letter-o">O</span>
            <span class="logo-letter letter-n">N</span>

            <span class="logo-space"></span>

            <span class="logo-letter letter-a">A</span>
            <span class="logo-letter letter-i">I</span>
            <span class="logo-letter letter-r">R</span>
        </div>

        <!-- TEAM NAME -->
        <div class="logo-arabic" dir="rtl">
            بِالعَافيَه
        </div>

        <div class="logo-rule">
            <span></span>
        </div>

    </div>

    
    <!-- =========================================
     TEAM STATEMENT
========================================= -->

<div class="intro-statement">

    <span>One Team, One Story</span>
    <span>Made Anyway</span>

</div>


<!-- =========================================
     FINAL STATEMENT
========================================= -->

<div class="intro-final-statement">

    لو الخطة نجحت، يبقى بالصدفة

</div>

<!-- =========================================
     ENTER
========================================= -->

<div class="enter-wrapper">

    <button
        id="enterExperience"
        class="enter-button"
        type="button"
        aria-label="Enter the Archive"
    >

        <!-- CINEMATIC CLAPPERBOARD -->

        <span class="enter-icon">

            <svg
                viewBox="0 0 64 64"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <!-- CLAPPER TOP -->

                <path
                    class="clapper-top"
                    d="M10 17
                       L14 8
                       H54
                       L58 17
                       Z"
                />

                <!-- CLAPPER STRIPES -->

                <path
                    class="clapper-stripe"
                    d="M20 8 L25 17"
                />

                <path
                    class="clapper-stripe"
                    d="M33 8 L38 17"
                />

                <path
                    class="clapper-stripe"
                    d="M46 8 L51 17"
                />

                <!-- BODY -->

                <rect
                    class="clapper-body"
                    x="10"
                    y="17"
                    width="48"
                    height="38"
                    rx="1"
                />

                <!-- HORIZONTAL LINES -->

                <line
                    class="clapper-line"
                    x1="17"
                    y1="29"
                    x2="51"
                    y2="29"
                />

                <line
                    class="clapper-line"
                    x1="17"
                    y1="39"
                    x2="42"
                    y2="39"
                />

                <line
                    class="clapper-line"
                    x1="17"
                    y1="47"
                    x2="35"
                    y2="47"
                />

                <!-- SMALL FRAME MARK -->

                <circle
                    class="clapper-dot"
                    cx="48"
                    cy="46"
                    r="2"
                />

            </svg>

        </span>


        <!-- TEXT -->

        <span class="enter-copy">

            <span class="enter-main">
                ENTER
            </span>

            <span class="enter-sub">
                ENTER THE ARCHIVE
            </span>

        </span>


        <!-- ARROW -->

        <span class="enter-arrow">
            →
        </span>

    </button>

</div>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
